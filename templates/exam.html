<!DOCTYPE html>
<html>
<head>
    <title>Exam - Online Exam System</title>

    <!-- Eye Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/webgazer@2.0.1/dist/webgazer.min.js"></script>

    <!-- Face Detection -->
    <script src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
        body { font-family: Arial; background:#f4f6f9; }

        #examContent { display:none; margin-top:20px; }

        #timer { font-size:22px; font-weight:bold; }

        #cameraBox {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 200px;
            height: 150px;
            border: 2px solid black;
            background: black;
        }

        video { width:100%; height:100%; }

        #startBtn {
            padding:10px 20px;
            font-size:16px;
        }
    </style>
</head>

<body data-duration="{{ duration }}">
<div id="violationPopup" style="
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
    z-index:9999;
">
    <div style="
        background:white;
        padding:25px;
        border-radius:10px;
        text-align:center;
        font-size:18px;
        max-width:300px;
    ">
        <h3>⚠️ Exam Terminated</h3>
        <p id="violationMessage"></p>
        <p style="font-size:14px; color:gray;">Submitting in 5 seconds...</p>
    </div>
</div>

<h2>⏳ Time Left: <span id="timer"></span></h2>

<button id="startBtn">Start Exam</button>

<div id="cameraBox">
    <video id="camera" autoplay muted playsinline></video>
</div>

<div id="examContent">

<form id="examForm" method="POST" action="/submit_exam">
<input type="hidden" name="exam_id" value="{{ exam_id }}">
<input type="hidden" name="malpractice" id="malpracticeFlag" value="false">
<input type="hidden" name="malpractice_reason" id="malpracticeReason">

{% for q in questions %}
    <p><b>{{ q.question }}</b></p>

    {% for opt in q.options %}
        <input type="radio" name="q{{ q.id }}" value="{{ opt }}" required>
        {{ opt }}<br>
    {% endfor %}

    <br>
{% endfor %}

<button type="submit">Submit Exam</button>
</form>

</div>

<script>

if (typeof faceapi === "undefined") {
    console.log("❌ face-api NOT loaded");
} else {
    console.log("✅ face-api loaded");
}

document.addEventListener("DOMContentLoaded", function () {

console.log("🔥 SCRIPT LOADED");

// ================= GLOBAL =================
let timeLeft = parseInt(document.body.dataset.duration || "30") * 60;
let timerInterval;
let examStarted = false;
let submitted = false;

let cameraStarted = false;
let audioContext = null;
let analyser = null;

// ================= REPORT =================
function reportViolation(status) {
    fetch('/report_violation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
    }).catch(() => {});
}

// ================= AUTO SUBMIT =================
function autoSubmit(reason) {

    if (submitted) return;
    submitted = true;

    console.log("🚨 AutoSubmit:", reason);
    reportViolation(reason);

    // 🔥 SET MALPRACTICE FLAG
    const flag = document.getElementById("malpracticeFlag");
    if (flag) flag.value = "true";

    // 🔥 (Optional) store reason
    const reasonInput = document.getElementById("malpracticeReason");
    if (reasonInput) reasonInput.value = reason;

    // 🔥 Show popup
    const popup = document.getElementById("violationPopup");
    const msg = document.getElementById("violationMessage");
    const countdownEl = document.getElementById("countdown");

    let seconds = 5;

    if (popup && msg) {
        msg.innerText = reason;
        popup.style.display = "flex";
    }

    // 🔥 Countdown
    if (countdownEl) {
        countdownEl.innerText = "Submitting in 5 seconds...";
        const interval = setInterval(() => {
            seconds--;
            countdownEl.innerText = "Submitting in " + seconds + " seconds...";
            if (seconds <= 0) clearInterval(interval);
        }, 1000);
    }

    // 🔥 Delay submit
    setTimeout(() => {
        const form = document.getElementById("examForm");
        if (form) form.submit();
    }, 5000);
}

// ================= FACE MODEL =================
async function loadFaceModel() {

    if (!window.faceapi) {
        console.log("❌ faceapi missing");
        return;
    }

    try {
        await faceapi.nets.tinyFaceDetector.loadFromUri("/static/models");
        console.log("✅ Face model loaded");
    } catch (err) {
        console.log("❌ Face model load error:", err);
    }
}
// ================= EYE TRACKING =================
function startEyeTracking() {

    if (!window.webgazer) {
        console.log("❌ webgazer not loaded");
        return;
    }

    // 🔥 IMPORTANT: disable mediapipe (prevents your previous errors)
    webgazer.params.use_face_mesh = false;

    let lookAwayStart = null;

    webgazer.setGazeListener((data) => {

        if (!data) return;

        let w = window.innerWidth;
        let h = window.innerHeight;

        // 👇 detect looking away
        if (
            data.x < w * 0.2 ||
            data.x > w * 0.8 ||
            data.y < h * 0.2 ||
            data.y > h * 0.8
        ) {

            if (!lookAwayStart) lookAwayStart = Date.now();

            if (Date.now() - lookAwayStart > 3000) {
                autoSubmit("Looking Away");
            }

        } else {
            lookAwayStart = null;
        }

    }).begin();

    // 🔥 hide extra video (fix double camera issue)
    webgazer.showVideo(false);
    webgazer.showFaceOverlay(false);
    webgazer.showPredictionPoints(false);

    console.log("✅ Eye tracking running WITHOUT mediapipe");
}

// ================= START BUTTON =================
const startBtn = document.getElementById("startBtn");

if (!startBtn) {
    console.log("❌ startBtn not found");
    return;
}

startBtn.onclick = async function () {

    console.log("🚀 START CLICKED");

    document.getElementById("examContent").style.display = "block";
    this.style.display = "none";

    await startCameraMic();
    console.log("✅ Camera done");

    await loadFaceModel();
    console.log("✅ Model loaded");

    startFaceDetection();
    startEyeTracking();
    startAudioDetection();

    startFullscreen();
    startTimer();

    examStarted = true;
};

// ================= TIMER =================
function startTimer() {
    updateTimer();

    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimer();

        if (timeLeft <= 0) autoSubmit("Time Up");
    }, 1000);
}

function updateTimer() {
    const el = document.getElementById("timer");
    if (!el) return;

    let m = Math.floor(timeLeft / 60);
    let s = timeLeft % 60;
    el.innerText = `${m}:${s < 10 ? "0" + s : s}`;
}

// ================= FULLSCREEN =================
function startFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
}

document.addEventListener("fullscreenchange", () => {
    if (!examStarted) return;
    if (!document.fullscreenElement) autoSubmit("Fullscreen Exit");
});

// ================= TAB SWITCH =================
document.addEventListener("visibilitychange", () => {
    if (!examStarted) return;
    if (document.hidden) autoSubmit("Tab Switch");
});

// ================= BLOCK SHORTCUTS =================
document.addEventListener("keydown", e => {
    if (e.ctrlKey && ["c","v","u","x"].includes(e.key.toLowerCase()))
        e.preventDefault();
});

document.addEventListener("contextmenu", e => e.preventDefault());

// ================= CAMERA + MIC =================
async function startCameraMic() {

    if (cameraStarted) return;
    cameraStarted = true;

    try {
        const video = document.getElementById("camera");

        const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user" },
    audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
    }
});
        video.srcObject = stream;

        await new Promise(resolve => {
            video.onloadedmetadata = () => {
                video.play();
                resolve();
            };
        });

        // AUDIO
        audioContext = new (window.AudioContext || window.webkitAudioContext)();

        if (audioContext.state === "suspended") {
            await audioContext.resume();
        }

        analyser = audioContext.createAnalyser();
        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);

        console.log("✅ Camera + Mic Ready");

    } catch (err) {
        console.log("❌ Camera Error:", err);
        autoSubmit("Camera Blocked");
    }
}

// ================= voice detection 
function startAudioDetection() {

    if (!analyser) {
        console.log("❌ analyser not ready");
        return;
    }

    let data = new Uint8Array(512);

    let voiceStart = null;
    let silenceStart = null;

    function checkAudio() {

        analyser.getByteTimeDomainData(data);

        let sum = 0;
        for (let i = 0; i < data.length; i++) {
            let val = (data[i] - 128) / 128;
            sum += val * val;
        }

        let volume = Math.sqrt(sum / data.length);

        console.log("🎤 Volume:", volume.toFixed(3));

        const THRESHOLD = 0.02;

        if (volume > THRESHOLD) {

            if (!voiceStart) {
                voiceStart = Date.now();
                console.log("🟡 Voice started");
            }

            silenceStart = null;

            // 🔥 If speaking continuously for 1sec → auto submit
            if (Date.now() - voiceStart > 1000) {
                autoSubmit("Voice Detected");
            }

        } else {

            // 👇 DO NOT reset immediately
            if (!silenceStart) silenceStart = Date.now();

            // 🔥 allow small silence gaps (1.5 sec tolerance)
            if (Date.now() - silenceStart > 1500) {
                voiceStart = null;
            }
        }

        requestAnimationFrame(checkAudio);
    }

    checkAudio();
}

let noFaceStart = null;
let multiFaceStart = null;

function startFaceDetection() {

    const video = document.getElementById("camera");

    async function detect() {

        if (!video || video.readyState < 2) {
            setTimeout(detect, 1000);
            return;
        }

        try {
            const detections = await faceapi.detectAllFaces(
                video,
                new faceapi.TinyFaceDetectorOptions()
            );

            console.log("Faces:", detections.length);

            // NO FACE
            if (detections.length === 0) {

                if (!noFaceStart) noFaceStart = Date.now();

                if (Date.now() - noFaceStart > 1000) {
                    autoSubmit("No Face");
                }

            } else {
                noFaceStart = null;
            }

            // MULTIPLE
            if (detections.length > 1) {

                if (!multiFaceStart) multiFaceStart = Date.now();

                if (Date.now() - multiFaceStart > 1000) {
                    autoSubmit("Multiple Faces");
                }

            } else {
                multiFaceStart = null;
            }

        } catch (err) {
            console.log("Face error:", err);
        }

        setTimeout(detect, 500);
    }

    detect();
}

// ================= CLEANUP =================
window.onbeforeunload = () => {
    clearInterval(timerInterval);
};

});
</script>

</body>
</html>
