<!DOCTYPE html>
<html>
<head>
    <title>Exam - Online Exam System</title>

    <!-- Eye Tracking -->
    <script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

    <style>
        body { font-family: Arial; background:#f4f6f9; }

        #examContent { display:none; margin-top:20px; }

        #timer { font-size:22px; font-weight:bold; }

        #cameraBox {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 200px;
            height: 150px;
            border: 2px solid black;
            background: black;
        }

        video { width:100%; height:100%; }

        #startBtn {
            padding:10px 20px;
            font-size:16px;
        }
    </style>
</head>

<body data-duration="{{ duration }}">

<h2>⏳ Time Left: <span id="timer"></span></h2>

<button id="startBtn">Start Exam</button>

<div id="cameraBox">
    <video id="camera" autoplay muted></video>
</div>

<div id="examContent">

<form id="examForm" method="POST" action="/submit_exam">

<input type="hidden" name="exam_id" value="{{ exam_id }}">

{% for q in questions %}
    <p><b>{{ q.question }}</b></p>

    {% for opt in q.options %}
        <input type="radio" name="q{{ q.id }}" value="{{ opt }}" required>
        {{ opt }}<br>
    {% endfor %}

    <br>
{% endfor %}

<button type="submit">Submit Exam</button>

</form>

</div>

<script>

let timeLeft = parseInt(document.body.dataset.duration) * 60;
let timerInterval;
let examStarted = false;

// ===================== BACKEND REPORT =====================
function reportViolation(status) {
    fetch('/report_violation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: status })
    });
}

// ===================== START EXAM =====================
document.getElementById("startBtn").onclick = async function () {

    document.getElementById("examContent").style.display = "block";
    this.style.display = "none";

    await startCameraMic();     // ✅ MUST BE FIRST
    await loadFaceModel();      // ✅ load model after camera

    startFaceDetection();       // ✅ then start detection
    startEyeTracking();
    startAudioDetection();
    startFullscreen();
    startTimer();

    examStarted = true;
};

// ===================== TIMER =====================
function startTimer() {
    updateTimer();

    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimer();

        if (timeLeft <= 0) autoSubmit("Time Up");

    }, 1000);
}

function updateTimer() {
    let m = Math.floor(timeLeft/60);
    let s = timeLeft%60;
    document.getElementById("timer").innerText =
        `${m}:${s<10?"0"+s:s}`;
}

// ===================== AUTO SUBMIT =====================
function autoSubmit(reason) {
    reportViolation(reason);
    alert("⚠️ " + reason);
    document.getElementById("examForm").submit();
}

// ===================== FULLSCREEN =====================
function startFullscreen() {
    let el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
}

document.addEventListener("fullscreenchange", () => {
    if (!examStarted) return;
    if (!document.fullscreenElement) {
        reportViolation("Fullscreen Exit");
        autoSubmit("Fullscreen Exit");
    }
});

// ===================== TAB SWITCH =====================
document.addEventListener("visibilitychange", () => {
    if (!examStarted) return;
    if (document.hidden) {
        reportViolation("Tab Switch");
        autoSubmit("Tab Switch");
    }
});

// ===================== BLOCK SHORTCUTS =====================
document.addEventListener("keydown", e => {
    if (e.ctrlKey && ["c","v","u","x"].includes(e.key.toLowerCase()))
        e.preventDefault();
});

// ===================== RIGHT CLICK =====================
document.addEventListener("contextmenu", e => e.preventDefault());

// ===================== CAMERA + MIC =====================
async function startCameraMic() {

    if (cameraStarted) return; // prevent duplicate start
    cameraStarted = true;

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true
        });

        const video = document.getElementById("camera");
        video.srcObject = stream;

        // 🔥 wait until video is ready
        await new Promise((resolve) => {
            video.onloadedmetadata = () => {
                video.play();
                resolve();
            };
        });

        // 🎤 Audio setup
        audioContext = new (window.AudioContext || window.webkitAudioContext)();

        // 🔥 IMPORTANT: resume context (fixes browser error)
        if (audioContext.state === "suspended") {
            await audioContext.resume();
        }

        analyser = audioContext.createAnalyser();

        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);

        console.log("✅ Camera + Mic Ready");

    } catch (err) {
        console.log("❌ Camera/Mic Error:", err);
        autoSubmit("Camera/Mic Blocked");
    }
}
// ===================== AUDIO DETECTION =====================
function startAudioDetection() {

    if (!analyser) {
        console.log("❌ Audio analyser not ready");
        return;
    }

    let data = new Uint8Array(512);

    function checkAudio() {

        analyser.getByteTimeDomainData(data);

        let sum = 0;
        for (let i = 0; i < data.length; i++) {
            let val = (data[i] - 128) / 128;
            sum += val * val;
        }

        let volume = Math.sqrt(sum / data.length);

        // 🔥 DEBUG
        console.log("Volume:", volume);

        if (volume > 0.1) {
            reportViolation("Voice Detected");
            autoSubmit("Voice Detected");
        }

        requestAnimationFrame(checkAudio);
    }

    checkAudio();
}

// ===================== EYE TRACKING =====================
let audioContext, analyser;

async function startCameraMic() {

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true
        });

        const video = document.getElementById("camera");
        video.srcObject = stream;

        // 🔥 WAIT until video is ready (VERY IMPORTANT)
        await new Promise((resolve) => {
            video.onloadedmetadata = () => {
                video.play();
                resolve();
            };
        });

        // 🎤 Audio setup
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();

        let source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);

        console.log("✅ Camera + Mic Ready");

    } catch (err) {
        console.log("❌ Camera/Mic Error:", err);
        autoSubmit("Camera/Mic Blocked");
    }
}

// ===================== CLEANUP =====================
window.onbeforeunload = () => {
    clearInterval(timerInterval);
};

</script>

</body>
</html>
