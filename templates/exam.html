<!DOCTYPE html>
<html>
<head>
    <title>Exam - Online Exam System</title>

    <!-- Eye Tracking -->
    <script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

    <!-- Face Detection -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

    <style>
        body { font-family: Arial; background:#f4f6f9; }

        #examContent { display:none; margin-top:20px; }

        #timer { font-size:22px; font-weight:bold; }

        #cameraBox {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 200px;
            height: 150px;
            border: 2px solid black;
            background: black;
        }

        video { width:100%; height:100%; }

        #startBtn {
            padding:10px 20px;
            font-size:16px;
        }
    </style>
</head>

<body data-duration="{{ duration }}">

<h2>⏳ Time Left: <span id="timer"></span></h2>

<button id="startBtn">Start Exam</button>

<div id="cameraBox">
    <video id="camera" autoplay muted playsinline></video>
</div>

<div id="examContent">

<form id="examForm" method="POST" action="/submit_exam">
<input type="hidden" name="exam_id" value="{{ exam_id }}">

{% for q in questions %}
    <p><b>{{ q.question }}</b></p>

    {% for opt in q.options %}
        <input type="radio" name="q{{ q.id }}" value="{{ opt }}" required>
        {{ opt }}<br>
    {% endfor %}

    <br>
{% endfor %}

<button type="submit">Submit Exam</button>
</form>

</div>

<script>

// ================= GLOBAL =================
let timeLeft = parseInt(document.body.dataset.duration) * 60;
let timerInterval;
let examStarted = false;
let submitted = false;

let cameraStarted = false;
let audioContext, analyser;

// ================= REPORT =================
function reportViolation(status) {
    fetch('/report_violation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: status })
    });
}

// ================= AUTO SUBMIT =================
function autoSubmit(reason) {
    if (submitted) return;
    submitted = true;

    reportViolation(reason);
    console.log("Violation:", reason);

    document.getElementById("examForm").submit();
}

// ================= START =================
document.getElementById("startBtn").onclick = async function () {

    console.log("🚀 START CLICKED");

    document.getElementById("examContent").style.display = "block";
    this.style.display = "none";

    await startCameraMic();
    console.log("✅ Camera done");

    await loadFaceModel();
    console.log("✅ Model loaded");

    startFaceDetection();
    console.log("✅ Face detection started");

    startEyeTracking();
    console.log("✅ Eye tracking started");

    startAudioDetection();
    console.log("✅ Audio started");

    startFullscreen();
    startTimer();

    examStarted = true;
};

// ================= TIMER =================
function startTimer() {
    updateTimer();

    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimer();

        if (timeLeft <= 0) autoSubmit("Time Up");

    }, 1000);
}

function updateTimer() {
    let m = Math.floor(timeLeft/60);
    let s = timeLeft%60;
    document.getElementById("timer").innerText =
        `${m}:${s<10?"0"+s:s}`;
}

// ================= FULLSCREEN =================
function startFullscreen() {
    let el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
}

document.addEventListener("fullscreenchange", () => {
    if (!examStarted) return;
    if (!document.fullscreenElement) {
        autoSubmit("Fullscreen Exit");
    }
});

// ================= TAB SWITCH =================
document.addEventListener("visibilitychange", () => {
    if (!examStarted) return;
    if (document.hidden) {
        autoSubmit("Tab Switch");
    }
});

// ================= BLOCK SHORTCUTS =================
document.addEventListener("keydown", e => {
    if (e.ctrlKey && ["c","v","u","x"].includes(e.key.toLowerCase()))
        e.preventDefault();
});

document.addEventListener("contextmenu", e => e.preventDefault());

// ================= CAMERA + MIC =================
async function startCameraMic() {

    if (cameraStarted) return;
    cameraStarted = true;

    try {

        const video = document.getElementById("camera");

        if (video.srcObject) {
            video.srcObject.getTracks().forEach(track => track.stop());
        }

        const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true
        });

        video.srcObject = stream;

        await new Promise(resolve => {
            video.onloadedmetadata = () => {
                video.play();
                resolve();
            };
        });

        // AUDIO
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === "suspended") await audioContext.resume();

        analyser = audioContext.createAnalyser();
        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);

        console.log("✅ Camera + Mic Ready");

    } catch (err) {
        console.log("Camera Error:", err);
        autoSubmit("Camera Blocked");
    }
}

// ================= AUDIO =================
function startAudioDetection() {

    if (!analyser) return;

    let data = new Uint8Array(512);
    let voiceStart = null;

    function checkAudio() {

        analyser.getByteTimeDomainData(data);

        let sum = 0;
        for (let i = 0; i < data.length; i++) {
            let val = (data[i] - 128) / 128;
            sum += val * val;
        }

        let volume = Math.sqrt(sum / data.length);

        if (volume > 0.12) {

            if (!voiceStart) voiceStart = Date.now();

            if (Date.now() - voiceStart > 3000) {
                autoSubmit("Voice Detected");
            }

        } else {
            voiceStart = null;
        }

        requestAnimationFrame(checkAudio);
    }

    checkAudio();
}

// ================= EYE =================
function startEyeTracking() {

    if (!window.webgazer) return;

    let lookAwayStart = null;

    webgazer.setGazeListener((data) => {

        if (!data) return;

        if (
            data.x < 0 ||
            data.x > window.innerWidth ||
            data.y < 0 ||
            data.y > window.innerHeight
        ) {

            if (!lookAwayStart) lookAwayStart = Date.now();

            if (Date.now() - lookAwayStart > 3000) {
                autoSubmit("Looking Away");
            }

        } else {
            lookAwayStart = null;
        }

    }).begin();

    webgazer.showVideo(false);
    webgazer.showFaceOverlay(false);
    webgazer.showFaceFeedbackBox(false);
    webgazer.showPredictionPoints(false);

    console.log("✅ Eye tracking started");
}

// ================= FACE =================
async function loadFaceModel() {
    await faceapi.nets.tinyFaceDetector.loadFromUri(
        "https://justadudewhohacks.github.io/face-api.js/models"
    );
    console.log("✅ Face model loaded");
}

let noFaceStart = null;
let multiFaceStart = null;

function startFaceDetection() {

    const video = document.getElementById("camera");

    async function detect() {

        if (video.readyState !== 4) {
            setTimeout(detect, 1000);
            return;
        }

        try {

            const detections = await faceapi.detectAllFaces(
                video,
                new faceapi.TinyFaceDetectorOptions()
            );

            // NO FACE
            if (detections.length === 0) {

                if (!noFaceStart) noFaceStart = Date.now();

                if (Date.now() - noFaceStart > 5000) {
                    autoSubmit("No Face");
                }

            } else {
                noFaceStart = null;
            }

            // MULTIPLE
            if (detections.length > 1) {

                if (!multiFaceStart) multiFaceStart = Date.now();

                if (Date.now() - multiFaceStart > 5000) {
                    autoSubmit("Multiple Faces");
                }

            } else {
                multiFaceStart = null;
            }

        } catch (err) {
            console.log("Face error:", err);
        }

        setTimeout(detect, 1500);
    }

    detect();
}

// ================= CLEANUP =================
window.onbeforeunload = () => {
    clearInterval(timerInterval);
};

</script>

</body>
</html>
